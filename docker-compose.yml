# Local stack: the production app image with Postgres 17 and S3-compatible storage.
#
#   cp .env.example .env        # then set AUTH_SECRET
#   docker compose up --build   # app on http://localhost:3000
#
# Share with a phone over HTTPS (free Cloudflare quick tunnel, no account needed):
#   docker compose --profile tunnel up --build
#   docker compose logs tunnel  # shows the https://<random>.trycloudflare.com URL
# Set APP_URL in .env to that URL and restart the app so links and sign-in use it.

name: wayfund

x-app-env: &app-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://wayfund:wayfund@db:5432/wayfund}
  S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://storage:8333}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wayfund
      POSTGRES_PASSWORD: wayfund
      POSTGRES_DB: wayfund
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfund -d wayfund"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2 locally (SeaweedFS; MinIO no longer
  # publishes images). Auth is off locally, so any S3 key pair works.
  storage:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports: ["127.0.0.1:8333:8333"]
    volumes: [storage-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: amazon/aws-cli:2.42.4
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://storage:8333 s3api head-bucket --bucket wayfund 2>/dev/null
        || aws --endpoint-url http://storage:8333 s3 mb s3://wayfund
    restart: "no"

  migrate:
    build: { context: ., target: migrator }
    env_file: [.env]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_APP_ENV: local
    image: wayfund-app:local
    init: true
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *app-env
      # Without a Resend key, sign-in links appear in `docker compose logs app`.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  tunnel:
    image: cloudflare/cloudflared:2025.4.2
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on: [app]

volumes:
  db-data:
  storage-data:
