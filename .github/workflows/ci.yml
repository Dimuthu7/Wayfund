name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Check migrations match the schema
        run: |
          pnpm db:generate --name ci-check
          git diff --exit-code --stat -- drizzle || (echo "::error::Schema changed without a migration. Run pnpm db:generate." && exit 1)

  integration:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wayfund
          POSTGRES_PASSWORD: wayfund
          POSTGRES_DB: wayfund
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wayfund" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wayfund:wayfund@localhost:5432/wayfund_test
      E2E_DATABASE_URL: postgres://wayfund:wayfund@localhost:5432/wayfund_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases
        run: |
          psql postgres://wayfund:wayfund@localhost:5432/wayfund -c "create database wayfund_test" -c "create database wayfund_e2e"
      - name: Row-level security and data tests
        run: pnpm test:db
      - name: Migrate e2e database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (360 px phone)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
